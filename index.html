<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Closet Match | Outfit ideas from the clothes you own</title>
<meta name="description" content="Browse outfit ideas matched to your body shape, undertone and style, built from what's already in your closet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111; --muted:#5F5F5F; --soft:#EFEFEF; --line:#E3E3E3; --paper:#FFFFFF;
  --berry:#9C1F4B; --berry-dark:#7A1639; --berry-tint:#F8E8EE; --leaf:#1F7A4D; --leaf-tint:#E4F3EA;
  --sans:'Figtree','Helvetica Neue',Arial,sans-serif; --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.top{position:sticky;top:0;z-index:30;background:var(--paper);display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--berry);font-family:var(--serif);font-weight:700;font-size:1.35rem;padding:6px 10px;border-radius:999px;white-space:nowrap}
.logo:hover{background:var(--soft)}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer}
.tab:hover{background:var(--soft)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;border:0;background:var(--soft);border-radius:999px;padding:13px 18px 13px 46px}
.search input:hover{background:#E4E4E4}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.iconbtn{position:relative;border:0;background:none;border-radius:999px;height:46px;min-width:46px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700}
.iconbtn:hover{background:var(--soft)}
.badge{position:absolute;top:4px;right:2px;background:var(--berry);color:#fff;font-size:.7rem;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.badge[data-n="0"]{display:none}

/* Profile strip */
.profile{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:6px 16px 4px}
.pill{border:0;background:var(--soft);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill:hover{background:#E4E4E4}
.pill b{font-weight:800}
.dots{display:inline-flex}
.dots i{width:14px;height:14px;border-radius:999px;border:2px solid var(--soft);margin-left:-4px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 18px;justify-content:center;scrollbar-width:none;flex-wrap:wrap}
.chip{flex:none;border:0;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}

/* Popover */
.pop{position:fixed;z-index:45;background:#fff;border-radius:18px;box-shadow:0 8px 36px rgba(0,0,0,.2);padding:16px;width:min(360px,calc(100vw - 24px))}
.pop h3{margin:0 0 4px;font-size:1rem}
.pop p.help{margin:0 0 12px;color:var(--muted);font-size:.88rem}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:12px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt[aria-checked="true"]{background:var(--berry-tint)}
.opt strong{display:block}
.opt small{color:var(--muted)}
.opt svg{flex:none;width:30px;height:30px;color:var(--berry)}

/* Board */
.intro{text-align:center;padding:4px 16px 0}
.intro h1{font-family:var(--serif);font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.intro p{margin:0 auto;color:var(--muted);max-width:52ch}
.board{columns:236px;column-gap:16px;padding:8px 16px 60px;max-width:1600px;margin:0 auto}
.pin{break-inside:avoid;margin:0 0 20px;display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:zoom-in;position:relative}
.canvas{position:relative;border-radius:16px;overflow:hidden;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pin:hover .canvas::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28);border-radius:16px}
.save{position:absolute;right:10px;top:10px;z-index:2;border:0;border-radius:999px;background:var(--berry);color:#fff;font-weight:700;padding:11px 16px;cursor:pointer;opacity:0}
.save.on{background:var(--ink);opacity:1}
.pin:hover .save,.pin:focus-within .save{opacity:1}
.fitflag{position:absolute;left:10px;bottom:10px;z-index:2;background:#fff;border-radius:999px;font-size:.78rem;font-weight:700;padding:5px 10px}
.pin:hover .fitflag{opacity:0}
.piece{background:rgba(255,255,255,.62);border-radius:10px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.piece.wide{grid-column:span 2}
.piece svg{width:64%;max-width:90px;height:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.14))}
.piece.wide svg{width:38%}
.piece span{font-size:.72rem;font-weight:600;color:#3d3d3d;text-align:center;line-height:1.2;text-transform:capitalize}
.piece.have{box-shadow:inset 0 0 0 2px var(--leaf)}
.pin-title{font-weight:700;font-size:.95rem;margin:8px 4px 2px;line-height:1.25}
.pin-meta{display:flex;align-items:center;gap:8px;margin:0 4px;font-size:.82rem;color:var(--muted)}
.own{display:inline-flex;gap:2px}
.own i{width:8px;height:8px;border-radius:999px;background:var(--line)}
.own i.on{background:var(--leaf)}
.empty{max-width:520px;margin:30px auto;text-align:center;color:var(--muted);padding:0 16px}
.empty strong{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:6px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--berry);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--berry-dark)}
.btn.grey{background:var(--soft);color:var(--ink)}
.btn.grey:hover{background:#E1E1E1}
.btn.dark{background:var(--ink)}

/* Closeup */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;overflow-y:auto;padding:20px 12px}
.overlay.open{display:block}
.closeup{max-width:1000px;margin:0 auto;background:#fff;border-radius:32px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative;box-shadow:0 10px 50px rgba(0,0,0,.25)}
.closeup .canvas{border-radius:0;padding:28px;gap:12px;align-content:center;min-height:100%}
.closeup .canvas::after{display:none}
.closeup .piece{padding:16px 8px 12px}
.closeup .piece span{font-size:.86rem}
.detail{padding:28px 30px 32px;display:flex;flex-direction:column}
.detail-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.close{border:0;background:var(--soft);width:44px;height:44px;border-radius:999px;cursor:pointer;display:grid;place-items:center}
.detail .occ{color:var(--muted);font-weight:600;font-size:.9rem}
.detail h2{font-family:var(--serif);font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.08;margin:2px 0 10px}
.detail .why{margin:0 0 18px;font-size:1.02rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tags span{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600}
.tags span.fit{background:var(--leaf-tint);color:var(--leaf)}
.tags span.nofit{background:#FFF1D6;color:#7A5200}
.detail h3{font-size:1.05rem;margin:0 0 8px}
.plist{list-style:none;margin:0 0 20px;padding:0}
.plist li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.plist .sw{width:22px;height:22px;border-radius:999px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.plist .nm{flex:1;text-transform:capitalize;font-weight:600}
.plist .nm small{display:block;font-weight:500;color:var(--muted);text-transform:none}
.plist .st{font-size:.82rem;font-weight:700;color:var(--leaf)}
.plist a{font-size:.82rem;font-weight:700;color:var(--berry)}
.detail .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.more{grid-column:1/-1;padding:4px 30px 30px}
.more h3{font-size:1.15rem;margin:10px 0 12px}
.more .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.more .pin .canvas{padding:8px;gap:5px}
.more .pin .piece{padding:6px 4px}
.more .pin .piece span{display:none}

/* Drawers */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:60;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;border-radius:24px 0 0 24px}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 8px}
.drawer h2{margin:0;font-family:var(--serif);font-size:1.6rem}
.drawer .sub{padding:0 22px 12px;margin:0;color:var(--muted);font-size:.92rem}
.drawer .body{overflow-y:auto;padding:4px 22px 24px;flex:1}
.drawer footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.group h4{margin:16px 0 8px;font-size:.92rem}
.group .chips{display:flex;flex-wrap:wrap;gap:8px}
.group .chip{text-transform:capitalize}
.slist{list-style:none;padding:0;margin:0}
.slist li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slist .sw{width:34px;height:34px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.slist .nm{flex:1;font-weight:700;text-transform:capitalize}
.slist .nm small{display:block;font-weight:500;color:var(--muted);text-transform:none}
.slist a{font-weight:700;color:var(--berry);font-size:.9rem}

/* About */
.about{max-width:760px;margin:0 auto;padding:10px 20px 70px}
.about h2{font-family:var(--serif);font-size:1.9rem;margin:0 0 12px}
.about h3{margin:22px 0 6px;font-size:1.1rem}
.about p{margin:0 0 10px;color:#2d2d2d}
.foot{text-align:center;color:var(--muted);font-size:.86rem;padding:0 16px 30px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;z-index:80;transition:transform .25s ease}
.toast.show{transform:translate(-50%,0)}

@media (max-width:820px){
  .top{flex-wrap:wrap}
  .tabs{order:5;width:100%;justify-content:center}
  .iconbtn .txt{display:none}
  .closeup{grid-template-columns:1fr;border-radius:24px}
  .logo span{display:none}
}
@media (max-width:520px){ .board{columns:2;column-gap:10px;padding:8px 10px 50px} .top{gap:4px;padding:10px} .chiprow{flex-wrap:nowrap;justify-content:flex-start} .profile .pill{padding:8px 13px;font-size:.92rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <a href="#" class="logo" id="home" aria-label="Closet Match home">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#9C1F4B"/><path d="M16 7a2.6 2.6 0 0 0-1.2 4.9V13L7 19.5a1.3 1.3 0 0 0 .8 2.3h16.4a1.3 1.3 0 0 0 .8-2.3L17.2 13v-1.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Closet Match</span>

  <nav class="tabs" role="tablist" aria-label="Views">

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  </div>
  <button class="iconbtn" id="openCloset" aria-label="My closet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a2 2 0 0 0-1 3.7V9l-7.4 6a1 1 0 0 0 .6 1.8h15.6a1 1 0 0 0 .6-1.8L13 9"/></svg><span class="txt">My closet</span><span class="badge" id="closetCount"></span></button>
  <button class="iconbtn" id="openShop" aria-label="Shopping list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="txt">Shopping list</span><span class="badge" id="shopCount"></span></button>
  <button class="iconbtn" id="openAbout" aria-label="About this project"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</header>

<div class="profile" aria-label="Your profile">
  <button class="pill" id="shapeBtn" aria-haspopup="true">Body shape: <b id="shapeLbl"></b></button>
  <button class="pill" id="toneBtn" aria-haspopup="true">Undertone: <span class="dots" id="toneDots"></span><b id="toneLbl"></b></button>
</div>
<div class="chiprow" id="styles" aria-label="Style filters"></div>

<section class="intro" id="intro"></section>
<main class="board" id="board" aria-live="polite"></main>
<section class="about" id="aboutSec" hidden></section>
<p class="foot">Closet Match, a product case study by Yesenia Navarro</p>

<div class="pop" id="pop" hidden role="dialog" aria-modal="false"></div>

</aside>

  <footer><button class="btn dark" id="copyShop">Copy list</button></footer>
</aside>

<script id="outfit-data" type="application/json">{"OUTFITS": [{"name": "Structured Blazer Set", "occasion": "Interview / work", "body_shapes": ["Rectangle", "Apple", "Inverted Triangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Classic", "Minimalist"], "pieces": ["blazer", "straight-leg trousers", "silk cami", "loafers"], "colors": {"blazer": "charcoal", "straight-leg trousers": "charcoal", "silk cami": "ivory", "loafers": "black"}, "why_it_works": "A single-color blazer and trouser set elongates the body and reads polished with almost no styling effort. Charcoal and ivory sit cool, so they're clean against cool or neutral undertones."}, {"name": "Wrap Top and Wide-Leg Trouser", "occasion": "Work / dinner", "body_shapes": ["Rectangle", "Apple", "Inverted Triangle"], "undertones": ["Warm", "Neutral"], "style_tags": ["Classic", "Romantic"], "pieces": ["wrap top", "wide-leg trousers", "belt", "heels"], "colors": {"wrap top": "rust", "wide-leg trousers": "camel", "belt": "cognac", "heels": "cognac"}, "why_it_works": "The wrap top creates a defined waist on straighter or fuller-midsection shapes without clinging. Rust and camel are warm, so they flatter warm and neutral undertones."}, {"name": "Belted Shirt Dress", "occasion": "Everyday", "body_shapes": ["Rectangle", "Hourglass"], "undertones": ["Warm", "Neutral"], "style_tags": ["Classic", "Preppy"], "pieces": ["shirt dress", "belt", "ankle boots"], "colors": {"shirt dress": "olive", "belt": "cognac", "ankle boots": "brown"}, "why_it_works": "Cinching a shirt dress at the natural waist adds shape on straighter frames while staying easy to wear. Olive and cognac are warm-leaning neutrals."}, {"name": "Monochrome Knit Set", "occasion": "Everyday", "body_shapes": ["Hourglass", "Pear", "Rectangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Minimalist"], "pieces": ["sweater", "straight-leg trousers", "sneakers"], "colors": {"sweater": "navy", "straight-leg trousers": "navy", "sneakers": "white"}, "why_it_works": "One color head to toe is the fastest way to look put-together, and it visually lengthens the body. Navy and white are cool and crisp."}, {"name": "A-Line Skirt and Fitted Top", "occasion": "Work / brunch", "body_shapes": ["Apple", "Inverted Triangle", "Rectangle"], "undertones": ["Warm", "Neutral"], "style_tags": ["Classic", "Romantic"], "pieces": ["a-line skirt", "fitted top", "loafers"], "colors": {"a-line skirt": "terracotta", "fitted top": "cream", "loafers": "tan"}, "why_it_works": "An A-line skirt skims over the hips and midsection while a fitted top keeps the proportions from swallowing you. Terracotta and cream are warm."}, {"name": "Wide-Leg Denim and Tank", "occasion": "Everyday", "body_shapes": ["Pear", "Hourglass", "Rectangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Minimalist", "Streetwear"], "pieces": ["wide-leg jeans", "tank top", "denim jacket", "sneakers"], "colors": {"wide-leg jeans": "mid-wash denim", "tank top": "white", "denim jacket": "light-wash denim", "sneakers": "white"}, "why_it_works": "Wide-leg denim balances a pear silhouette without adding bulk anywhere. Double denim reads intentional when the washes are slightly different."}, {"name": "Slip Dress Layered Over Tee", "occasion": "Everyday", "body_shapes": ["Hourglass", "Rectangle", "Apple"], "undertones": ["Cool", "Neutral"], "style_tags": ["Edgy", "Streetwear"], "pieces": ["slip dress", "white tee", "ankle boots"], "colors": {"slip dress": "black", "white tee": "white", "ankle boots": "black"}, "why_it_works": "Layering a tee under a slip dress softens it for daytime and adds structure on top for straighter or fuller-midsection shapes. Black and white are cool-neutral."}, {"name": "Cropped Jacket and High-Waisted Denim", "occasion": "Everyday", "body_shapes": ["Rectangle", "Pear", "Hourglass"], "undertones": ["Warm", "Neutral"], "style_tags": ["Streetwear", "Edgy"], "pieces": ["cropped jacket", "high-waisted jeans", "white tee", "sneakers"], "colors": {"cropped jacket": "chocolate brown", "high-waisted jeans": "dark-wash denim", "white tee": "off-white", "sneakers": "white"}, "why_it_works": "A cropped jacket hits right at the natural waist, creating shape on a straighter frame without adding volume. Brown and dark denim sit warm."}, {"name": "Peplum Top and Skinny Jean", "occasion": "Dinner", "body_shapes": ["Rectangle", "Apple"], "undertones": ["Warm", "Neutral"], "style_tags": ["Romantic", "Classic"], "pieces": ["peplum top", "skinny jeans", "heels"], "colors": {"peplum top": "rust", "skinny jeans": "dark-wash denim", "heels": "nude"}, "why_it_works": "The peplum flare creates a waist illusion on straighter or fuller-midsection shapes. Rust is warm and reads rich against warm undertones."}, {"name": "Boyfriend Blazer Over Dress", "occasion": "Work", "body_shapes": ["Pear", "Hourglass", "Inverted Triangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Classic", "Edgy"], "pieces": ["blazer", "little black dress", "ankle boots"], "colors": {"blazer": "black", "little black dress": "black", "ankle boots": "black"}, "why_it_works": "An oversized blazer over a fitted dress balances broader shoulders and adds structure without hiding the waist. All black is safely cool-neutral."}, {"name": "Flowy Blouse and Tailored Short", "occasion": "Summer everyday", "body_shapes": ["Apple", "Inverted Triangle"], "undertones": ["Warm", "Neutral"], "style_tags": ["Boho", "Romantic"], "pieces": ["flowy blouse", "tailored shorts", "sandals"], "colors": {"flowy blouse": "coral", "tailored shorts": "cream", "sandals": "tan"}, "why_it_works": "A blouse that skims rather than clings works with a fuller midsection or broader shoulders, and tailored shorts keep the bottom half from looking sloppy. Coral is warm."}, {"name": "Turtleneck and Midi Skirt", "occasion": "Work / fall", "body_shapes": ["Hourglass", "Pear", "Rectangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Classic", "Minimalist"], "pieces": ["turtleneck", "midi skirt", "], "style_tags": ["Preppy", "Classic"], "pieces": ["button-down shirt", "sweater vest", "straight-leg trousers", "loafers"], "colors": {"button-down shirt": "white", "sweater vest": "navy", "straight-leg trousers": "grey", "loafers": "brown"}, "why_it_works": "Layering a collar under a vest adds visual structure through the shoulders and chest, useful for a fuller midsection. Navy and grey are cool-neutral."}, {"name": "Wrap Dress", "occasion": "Work / dinner", "body_shapes": ["Hourglass", "Pear", "Apple", "Rectangle"], "undertones": ["Warm", "Neutral"], "style_tags": ["Classic", "Romantic"], "pieces": ["wrap dress", "heels"], "colors": {"wrap dress": "terracotta", "heels": "nude"}, "why_it_works": "A wrap dress is designed to define the waist on nearly any shape, it's the single most universally flattering silhouette in the dataset. Terracotta is warm."}, {"name": "Cargo Pant and Fitted Tank", "occasion": "Streetwear casual", "body_shapes": ["Hourglass", "Inverted Triangle", "Rectangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Streetwear", "Edgy"], "pieces": ["cargo pants", "tank top", "sneakers"], "colors": {"cargo pants": "olive", "tank top": "black", "sneakers": "white"}, "why_it_works": "A fitted tank keeps a relaxed cargo silhouette from reading shapeless, especially useful for broader shoulders. Olive and black work coolneutral."}, {"name": "Pencil Skirt and Silk Blouse", "occasion": "Interview / work", "body_shapes": ["Hourglass", "Pear"], "undertones": ["Cool", "Neutral"], "style_tags": ["Classic", "Minimalist"], "pieces": ["pencil skirt", "silk blouse", "heels"], "colors": {"pencil skirt": "black", "silk blouse": "ivory", "heels": "black"}, "why_it_works": "A pencil skirt follows the natural waist-to-hip line, which is exactly what an hourglass or pear shape wants to show off. Black and ivory are cool-neutral and interview-safe."}, {"name": "Oversized Sweater and Legging", "occasion": "Casual / cold weather", "body_shapes": ["Pear", "Hourglass"], "undertones": ["Warm", "Neutral"], "style_tags": ["Boho", "Athleisure"], "pieces": ["oversized sweater", "leggings", "ankle boots", "belt"], "colors": {"oversized sweater": "mustard", "leggings": "black", "ankle boots": "brown", "belt": "brown"}, "why_it_works": "Belting an oversized sweater at the waist keeps it from swallowing the shape entirely, good for a pear or hourglass frame in colder months. Mustard is warm."}, {"name": "Boxy Tee and Trouser", "occasion": "Casual work", "body_shapes": ["Inverted Triangle", "Apple", "Rectangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Minimalist", "Streetwear"], "pieces": ["boxy tee", "wide-leg trousers", "sneakers"], "colors": {"boxy tee": "white", "wide-leg trousers": "black", "sneakers": "white"}, "why_it_works": "A boxy tee that doesn't cling through the shoulders or midsection, paired with wide-leg trousers, keeps proportions balanced top to bottom. Black and white are cool-neutral."}, {"name": "Corset Top and Trouser", "occasion": "Night out", "body_shapes": ["Rectangle", "Apple", "Inverted Triangle"], "undertones": ["Cool", "Neutral"], "style_tags": ["Edgy", "Romantic"], "pieces": ["corset top", "wide-leg trousers", "heels"], "colors": {"corset top": "black", "wide-leg trousers": "black", "heels": "black"}, "why_it_works": "A corset top manufactures a defined waist on shapes that don't have one naturally. All black keeps it from reading costume-y."}, {"name": "Boho Maxi and Denim Vest", "occasion": "Festival / summer", "body_shapes": ["Hourglass", "Pear", "Apple"], "undertones": ["Warm", "Neutral"], "style_tags": ["Boho"], "pieces": ["maxi dress", "denim vest", "sandals"], "colors": {"maxi dress": "rust", "denim vest": "light-wash", "sandals": "tan"}, "why_it_works": "A flowy maxi skims the whole lower body while the vest adds structure up top, a good balance for pear or apple shapes. Rust is warm and photographs well outdoors."}], "ALL_PIECES": ["a-line skirt", "ankle boots", "belt", "blazer", "boxy tee", "button-down shirt", "cargo pants", "corset top", "cropped hoodie", "cropped jacket", "denim jacket", "denim vest", "fitted top", "flowy blouse", "heels", "high-waisted jeans", "leather jacket", "leggings", "little black dress", "loafers", "maxi dress", "midi skirt", "oversized sweater", "pencil skirt", "peplum top", "sandals", "shirt dress", "silk blouse", "silk cami", "skinny jeans", "slip dress", "sneakers", "straight-leg jeans", "straight-leg trousers", "sundress", "sweater", "sweater vest", "tailored shorts", "tank top", "turtleneck", "white tee", "wide-leg jeans", "wide-leg trousers", "wrap dress", "wrap top"], "BODY_SHAPES": {"Hourglass": "Bust and hips are close in width with a clearly defined waist.", "Pear": "Hips are noticeably wider than the bust, with a defined waist.", "Apple": "Fuller through the midsection, with less waist definition.", "Rectangle": "Bust, waist, and hips are similar in width, with a straighter line.", "Inverted Triangle": "Shoulders or bust are broader than the hips."}, "UNDERTONES": {"Warm": "Golden, peachy, or yellow undertones. Gold jewelry usually reads better than silver.", "Cool": "Pink, red, or blue undertones. Silver jewelry usually reads better than gold.", "Neutral": "A mix of both. Gold and silver both work."}, "STYLE_TAGS": ["Minimalist", "Classic", "Streetwear", "Boho", "Edgy", "Romantic", "Athleisure", "Preppy"]}</script>
<script>
const DATA = JSON.parse(document.getElementById("outfit-data").textContent);
const { OUTFITS, ALL_PIECES, BODY_SHAPES, UNDERTONES, STYLE_TAGS } = DATA;
OUTFITS.forEach((o,i) => o.id = i);

const COLORS = {black:"#1b1b1b",white:"#ffffff",ivory:"#f5f0e6",cream:"#f2ead9","off-white":"#f3efe6",navy:"#1f2a44",charcoal:"#3a3a3a",grey:"#9a9a9a","heather grey":"#b7b3ac",camel:"#c19a6b",cognac:"#8a5a34",tan:"#c9a876",brown:"#5c4433","chocolate brown":"#3f2a1d",rust:"#b5502e",terracotta:"#c1652f",olive:"#6b6b3a",mustard:"#c99a2e",coral:"#e2725b",nude:"#d9b79c","mid-wash denim":"#5b7797","dark-wash denim":"#334255","light-wash denim":"#a9c0d3","light-wash":"#a9c0d3"};
const hex = c => COLORS[(c||"").toLowerCase().trim()] || "#c9bfae";
const light = h => { const n = parseInt(h.slice(1),16); return ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114)/1000 > 200; };
const BOARDS = ["#F1ECE6","#ECEEE9","#F2EAEE","#E9EDF2","#F3EFE3","#EEE9F2"];
const TONE_DOTS = {Warm:["#c19a6b","#b5502e","#c99a2e"],Cool:["#1f2a44","#6b2737","#3a3a3a"],Neutral:["#9a9a9a","#c9bfae","#7a7166"]};
const SHAPE_ICONS = {
  "Hourglass":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12l-4 9 4 9H6l4-9z"/></svg>',
  "Pear":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3h6l1 6c3 2 4 6 4 12H4c0-6 1-10 4-12z"/></svg>',
  "Apple":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3h8l1 4c3 3 3 10 0 14H7c-3-4-3-11 0-14z"/></svg>',
  "Rectangle":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="3" width="12" height="18" rx="1"/></svg>',
  "Inverted Triangle":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3h16l-5 18H9z"/></svg>'
};

/* garment drawings, one per kind of piece */
function kind(p){
  if(/boot|sneaker|heel|loafer|sandal/.test(p)) return "shoe";
  if(/dress/.test(p)) return "dress";
  if(/skirt/.test(p)) return "skirt";
  if(/shorts/.test(p)) return "shorts";
  if(/jean|trouser|pant|legging/.test(p)) return "pants";
  if(/belt/.test(p)) return "belt";
  if(/blazer|jacket|hoodie/.test(p)) return "jacket";
  if(/cami|tank|corset|vest/.test(p)) return "tank";
  if(/sweater|turtleneck/.test(p)) return "sweater";
  return "top";
}
const SHAPES = {
  top:'<path d="M22 8 8 16l6 10 6-4v34h24V22l6 4 6-10-14-8c-2 4-6 6-10 6s-8-2-10-6z"/>',
  sweater:'<path d="M22 8 10 14 4 46l7 2 7-24v32h28V24l7 24 7-2-6-32-12-6c-2 4-6 6-10 6s-8-2-10-6z"/>',
  jacket:'<path d="M22 6 10 12 4 48l7 2 7-24v32h12V16l2 0 2 0v42h12V26l7 24 7-2-6-36-12-6-8 12z"/>',
  tank:'<path d="M24 6h4l4 10 4-10h4l2 14 4 38H18l4-38z"/>',
  dress:'<path d="M24 4h4l4 8 4-8h4l1 14-3 6 12 36H10l12-36-3-6z"/>',
  skirt:'<path d="M20 8h24l12 46c-8 4-40 4-48 0z"/>',
  shorts:'<path d="M16 10h32l4 30H36l-4-14-4 14H12z"/>',
  pants:'<path d="M18 4h28l4 56H38L32 22l-6 38H14z"/>',
  shoe:'<path d="M6 36c0-6 3-12 8-12 3 0 6 4 10 6 7 4 16 6 24 8 6 2 10 5 10 10v4H6z"/>',
  belt:'<path d="M2 28h60v10H2z"/><path d="M26 25h12v16H26z" fill="none" stroke-width="3"/>'
};
function garment(piece, color){
  const h = hex(color), s = light(h) ? "#bdb5aa" : "rgba(0,0,0,.25)";
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="${h}" stroke="${s}" stroke-width="1.4" stroke-linejoin="round">${SHAPES[kind(piece)]}</g></svg>`;
}

/* state, remembered in this browser when possible */
const store = { get(k,d){ try{ const v = localStorage.getItem("cm:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem("cm:"+k, JSON.stringify(v)); }catch(e){} } };
let shape = store.get("shape","Hourglass"), tone = store.get("tone","Neutral");
let styles = new Set(store.get("styles",["Classic","Minimalist"]));
let closet = new Set(store.get("closet",["white tee","straight-leg jeans","sneakers","blazer","little black dress","ankle boots"]));
let saved = new Set(store.get("saved",[]));
let view = "foryou", query = "", openId = null;
const persist = () => { store.set("shape",shape); store.set("tone",tone); store.set("styles",[...styles]); store.set("closet",[...closet]); store.set("saved",[...saved]); };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shopUrl = (c,p) => "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(`${c} ${p} women`);

function enrich(o){
  const have = o.pieces.filter(p => closet.has(p)), missing = o.pieces.filter(p => !closet.has(p));
  const fits = o.body_shapes.includes(shape) && o.undertones.includes(tone);
  const styleHits = o.style_tags.filter(t => styles.has(t)).length;
  return {...o, have, missing, fits, styleHits};
}
function listFor(){
  let list = OUTFITS.map(enrich);
  if(view==="foryou") list = list.filter(o => o.fits);
  if(view==="saved") list = list.filter(o => saved.has(o.id));
  if(query){ const q = query.toLowerCase(); list = list.filter(o => [o.name,o.occasion,...o.pieces,...o.style_tags,...Object.values(o.colors)].join(" ").toLowerCase().includes(q)); }
  if(view!=="saved") list.sort((a,b) => (b.fits - a.fits) || b.styleHits - a.styleHits || a.missing.length - b.missing.length);
  return list;
}

/* rendering */
function canvas(o){
  return `<div class="canvas" style="background:${BOARDS[o.id % BOARDS.length]}">${o.pieces.map(p => {
    const wide = o.pieces.length % 2 === 1 && o.pieces.indexOf(p) === 0;
    return `<div class="piece${wide?" wide":""}${closet.has(p)?" have":""}">${garment(p, o.colors[p])}<span>${esc(p)}</span></div>`;
  }).join("")}</div>`;
}
function pin(o, small){
  const dots = o.pieces.map((_,i) => `<i class="${i < o.have.length ? "on":""}"></i>`).join("");
  return `<div class="pin" role="button" tabindex="0" data-open="${o.id}" aria-label="${esc(o.name)}">
    ${small ? "" : `<button class="save${saved.has(o.id)?" on":""}" type="button" data-save="${o.id}">${saved.has(o.id)?"Saved":"Save"}</button>`}
    ${canvas(o)}
    ${small ? "" : (o.missing.length === 0 ? `<span class="fitflag">In your closet</span>` : "")}
    <div class="pin-title">${esc(o.name)}</div>
    ${small ? "" : `<div class="pin-meta"><span class="own" aria-hidden="true">${dots}</span>You own ${o.have.length} of ${o.pieces.length}</div>`}
  </div>`;
}
function renderIntro(n){
  const t = {
    foryou:[`Outfits for you`, `${n} ideas for a ${shape.toLowerCase()} shape with ${tone.toLowerCase()} undertones${styles.size ? `, with ${[...styles].join(" and ").toLowerCase()} looks first` : ""}. A green outline means you already own that piece.`],
    explore:[`Explore every outfit`, `All ${OUTFITS.length} outfit ideas. The ones that suit your profile come first.`],
    saved:[`Your saved outfits`, n ? `The pieces you're missing from these go straight to your shopping list.` : ``]
  }[view];
  $("#intro").innerHTML = `<h1>${t[0]}</h1><p>${t[1]}</p>`;
}
function render(){
  const list = listFor();
  renderIntro(list.length);
  $("#board").innerHTML = list.length ? list.map(o => pin(o)).join("") : emptyState();
  $("#closetCount").textContent = closet.size; $("#closetCount").dataset.n = closet.size;
  const n = shopping().length; $("#shopCount").textContent = n; $("#shopCount").dataset.n = n;
}
function emptyState(){
  if(query) return `<div class="empty"><strong>Nothing matches "${esc(query)}"</strong>Try a piece like "blazer," a color like "camel," or an occasion like "work."</div>`;
  if(view==="saved") return `<div class="empty"><strong>Nothing saved yet</strong>Tap Save on any outfit you'd wear. Your shopping list builds itself from the pieces you're missing.<br><br><button class="btn" data-view-go="foryou">Browse outfits</button></div>`;
  return `<div class="empty"><strong>No outfits for this profile yet</strong>Try a different undertone, or see everything in Explore.<br><br><button class="btn" data-view-go="explore">Go to Explore</button></div>`;
}
function renderStyles(){
  $("#styles").innerHTML = STYLE_TAGS.map(t => `<button class="chip" type="button" data-style="${t}" aria-pressed="${styles.has(t)}">${t}</button>`).join("");
}
function renderProfile(){
  $("#shapeLbl").textContent = shape; $("#toneLbl").textContent = tone;
  $("#toneDots").innerHTML = TONE_DOTS[tone].map(c => `<i style="background:${c}"></i>`).join("");
}

/* closeup */
function openPin(id){
  openId = +id; const o = enrich(OUTFITS[openId]);
  const fitTag = o.fits ? `<span class="fit">Suits your shape and undertone</span>` : `<span class="nofit">Styled for ${o.body_shapes.join(", ").toLowerCase()} shapes</span>`;
  const similar = OUTFITS.map(enrich).filter(x => x.id !== o.id && x.style_tags.some(t => o.style_tags.includes(t))).sort((a,b) => b.fits - a.fits).slice(0,6);
  $("#closeup").innerHTML = `
    ${canvas(o)}
    <div class="detail">
      <div class="detail-top"><span class="occ">${esc(o.occasion)}</span><button class="close" data-x aria-label="Close">✕</button></div>
      <h2 id="cTitle">${esc(o.name)}</h2>
      <p class="why">${esc(o.why_it_works)}</p>
      <div class="tags">${fitTag}${o.style_tags.map(t => `<span>${t}</span>`).join("")}</div>
      <h3>The pieces</h3>
      <ul class="plist">${o.pieces.map(p => `<li><span class="sw" style="background:${hex(o.colors[p])}"></span><span class="nm">${esc(p)}<small>${esc(o.colors[p]||"any color")}</small></span>${closet.has(p) ? `<span class="st">You own this</span>` : `<a href="${shopUrl(o.colors[p]||"",p)}" target="_blank" rel="noopener">Shop</a>`}</li>`).join("")}</ul>
      <div class="actions">
        <button class="btn${saved.has(o.id)?" dark":""}" data-save="${o.id}">${saved.has(o.id) ? "Saved" : "Save outfit"}</button>
        ${o.missing.length ? `<button class="btn grey" data-addall="${o.id}">I own all of these</button>` : ""}
      </div>
    </div>
    ${similar.length ? `<div class="more"><h3>More like this</h3><div class="row">${similar.map(s => pin(s,true)).join("")}</div></div>` : ""}`;
  $("#overlay").classList.add("open"); $("#overlay").setAttribute("aria-hidden","false"); $("#overlay").scrollTop = 0;
  document.body.style.overflow = "hidden"; $("#closeup .close").focus();
}
function closePin(){ $("#overlay").classList.remove("open"); $("#overlay").setAttribute("aria-hidden","true"); document.body.style.overflow = ""; openId = null; }

/* closet + shopping */
const GROUPS = [["Tops",["top","tank","sweater"]],["Outerwear",["jacket"]],["Bottoms",["pants","skirt","shorts"]],["Dresses",["dress"]],["Shoes",["shoe"]],["Accessories",["belt"]]];
function renderCloset(){
  $("#closetBody").innerHTML = GROUPS.map(([label,kinds]) => {
    const items = ALL_PIECES.filter(p => kinds.includes(kind(p)));
    return items.length ? `<div class="group"><h4>${label}</h4><div class="chips">${items.map(p => `<button class="chip" type="button" data-piece="${esc(p)}" aria-pressed="${closet.has(p)}">${esc(p)}</button>`).join("")}</div></div>` : "";
  }).join("");
}
function shopping(){
  const m = new Map();
  OUTFITS.filter(o => saved.has(o.id)).forEach(o => o.pieces.filter(p => !closet.has(p)).forEach(p => {
    const c = o.colors[p] || "", k = c+"|"+p;
    if(!m.has(k)) m.set(k,{p,c,for:[]}); m.get(k).for.push(o.name);
  }));
  return [...m.values()].sort((a,b) => a.p.localeCompare(b.p));
}
function renderShop(){
  const items = shopping();
  $("#shopBody").innerHTML = !saved.size
    ? `<div class="empty"><strong>Save an outfit first</strong>Missing pieces from the outfits you save show up here with a link to shop each one.</div>`
    : !items.length ? `<div class="empty"><strong>You own everything</strong>Every piece in your saved outfits is already in your closet.</div>`
    : `<ul class="slist">${items.map(i => `<li><span class="sw" style="background:${hex(i.c)}"></span><span class="nm">${esc((i.c+" "+i.p).trim())}<small>For ${esc(i.for.join(", "))}</small></span><a href="${shopUrl(i.c,i.p)}" target="_blank" rel="noopener">Shop</a></li>`).join("")}</ul>`;
}
let openDrawer = null;
function showDrawer(id){ openDrawer = $(id); if(id==="#closetDrawer") renderCloset(); else renderShop();
  openDrawer.classList.add("open"); openDrawer.setAttribute("aria-hidden","false"); $("#scrim").classList.add("open"); openDrawer.querySelector(".close").focus(); }
function hideDrawer(){ if(!openDrawer) return; openDrawer.classList.remove("open"); openDrawer.setAttribute("aria-hidden","true"); $("#scrim").classList.remove("open"); openDrawer = null; }

/* profile popovers */
function showPop(btn, type){
  const pop = $("#pop"), opts = type==="shape" ? BODY_SHAPES : UNDERTONES, cur = type==="shape" ? shape : tone;
  pop.innerHTML = `<h3>${type==="shape" ? "Your body shape" : "Your undertone"}</h3><p class="help">${type==="shape" ? "Pick the one that sounds most like you. It changes which outfits we suggest." : "Check the veins on your wrist: greenish usually means warm, blue or purple means cool, a mix means neutral."}</p>` +
    Object.entries(opts).map(([k,d]) => `<button class="opt" role="menuitemradio" aria-checked="${k===cur}" data-${type}="${k}">${type==="shape" ? SHAPE_ICONS[k] : `<span class="dots" style="padding-left:4px">${TONE_DOTS[k].map(c=>`<i style="background:${c}"></i>`).join("")}</span>`}<span><strong>${k}</strong><small>${esc(d)}</small></span></button>`).join("");
  const r = btn.getBoundingClientRect();
  pop.hidden = false;
  pop.style.top = (r.bottom + 8) + "px";
  pop.style.left = Math.max(12, Math.min(window.innerWidth - pop.offsetWidth - 12, r.left + r.width/2 - pop.offsetWidth/2)) + "px";
  pop.querySelector(".opt").focus();
}
const hidePop = () => { $("#pop").hidden = true; };

/* about */
function renderAbout(){
  $("#aboutSec").innerHTML = `<h2>About Closet Match</h2>
    <p>Closet Match is a styling tool I built as a product case study. It answers a question most people ask while staring at a full closet: what can I actually wear, and what one piece would unlock more outfits?</p>
    <h3>How it works</h3>
    <p>You pick your body shape, undertone and the styles you like, then tap the pieces you already own. Every outfit idea shows which pieces you have, and saving an outfit adds whatever you're missing to one combined shopping list.</p>
    <h3>Decisions I made on purpose</h3>
    <p><strong>Body shape and undertone are self-selected, not detected from a photo.</strong> Skin-tone detection from images is a documented bias risk, and collecting body photos is a real privacy liability. Choosing from clear descriptions gets most of the value without either problem.</p>
    <p><strong>No AI "see yourself in this outfit" feature.</strong> Generating realistic images of a real person is hard to do well, and on a public site anyone could upload a photo of anyone, which is exactly how that kind of feature gets misused.</p>
    <p><strong>Shopping links open a search, not one retailer's product.</strong> There's no store integration yet, so a search is honest about what the link does.</p>
    <h3>What's next</h3>
    <p>Outfit ideas from a larger, stylist-reviewed set, a "one piece away" view that ranks purchases by how many new outfits they unlock, and accounts so a closet follows you between devices.</p>`;
}

/* events */
document.addEventListener("click", e => {
  const t = e.target;
  const sv = t.closest("[data-save]");
  if(sv){ e.stopPropagation(); const id = +sv.dataset.save; saved.has(id) ? saved.delete(id) : saved.add(id); persist(); toast(saved.has(id) ? "Saved. Missing pieces added to your shopping list" : "Removed from saved"); render(); if(openId!==null) openPin(openId); return; }
  const aa = t.closest("[data-addall]");
  if(aa){ OUTFITS[+aa.dataset.addall].pieces.forEach(p => closet.add(p)); persist(); render(); openPin(openId); toast("Added to your closet"); return; }
  const op = t.closest("[data-open]");
  if(op){ openPin(op.dataset.open); return; }
  if(t.closest("[data-x]") || t.id === "overlay"){ closePin(); return; }
  const st = t.closest("[data-style]");
  if(st){ const s = st.dataset.style; styles.has(s) ? styles.delete(s) : styles.add(s); persist(); renderStyles(); render(); return; }
  const pc = t.closest("[data-piece]");
  if(pc){ const p = pc.dataset.piece; closet.has(p) ? closet.delete(p) : closet.add(p); pc.setAttribute("aria-pressed", closet.has(p)); persist(); render(); return; }
  const sh = t.closest("[data-shape]"), tn = t.closest("[data-tone]");
  if(sh){ shape = sh.dataset.shape; persist(); renderProfile(); render(); hidePop(); return; }
  if(tn){ tone = tn.dataset.tone; persist(); renderProfile(); render(); hidePop(); return; }
  const vg = t.closest("[data-view-go]");
  if(vg){ setView(vg.dataset.viewGo); return; }
  if(t.closest("[data-close]") || t.id === "scrim"){ hideDrawer(); return; }
  if(!t.closest("#pop") && !t.closest("#shapeBtn") && !t.closest("#toneBtn")) hidePop();
});
document.addEventListener("keydown", e => {
  const op = e.target.closest && e.target.closest(".pin[data-open]");
  if(op && (e.key==="Enter"||e.key===" ") && e.target === op){ e.preventDefault(); openPin(op.dataset.open); }
  if(e.key==="Escape"){ if(!$("#pop").hidden) hidePop(); else if($("#overlay").classList.contains("open")) closePin(); else hideDrawer(); }
});
function setView(v){
  view = v; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.view===v));
  $("#aboutSec").hidden = true; $("#board").hidden = false; $("#intro").hidden = false; render(); window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$("#home").addEventListener("click", e => { e.preventDefault(); setView("foryou"); });
$("#q").addEventListener("input", e => { query = e.target.value.trim(); if(query && view==="foryou") setView("explore"); else render(); });
$("#shapeBtn").addEventListener("click", e => $("#pop").hidden ? showPop(e.currentTarget,"shape") : hidePop());
$("#toneBtn").addEventListener("click", e => $("#pop").hidden ? showPop(e.currentTarget,"tone") : hidePop());
$("#openCloset").addEventListener("click", () => showDrawer("#closetDrawer"));
$("#openShop").addEventListener("click", () => showDrawer("#shopDrawer"));
$("#openAbout").addEventListener("click", () => { renderAbout(); $("#aboutSec").hidden = false; $("#board").hidden = true; $("#intro").hidden = true; window.scrollTo(0,0); });
$("#clearCloset").addEventListener("click", () => { closet.clear(); persist(); renderCloset(); render(); });
$("#copyShop").addEventListener("click", async () => {
  const items = shopping(); if(!items.length) return toast("Your list is empty");
  const text = "Shopping list\n" + items.map(i => `- ${(i.c+" "+i.p).trim()}`).join("\n");
  try{ await navigator.clipboard.writeText(text); toast("Copied"); }catch(err){ toast("Copy isn't available here"); }
});
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200); }

renderProfile(); renderStyles(); render();
</script>
</body>
</html>
